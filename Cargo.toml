[package]
name = "github"
description = "GitHub for the machine you are on — your repos, then everything about one."
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/roest1/github-tui"

[lib]
name = "github"
path = "src/lib.rs"

[[bin]]
name = "github"
path = "src/main.rs"

[dependencies]
# The same spec as every other tui-core user, so they resolve to one copy.
tui-core = { git = "https://github.com/roest1/tui-core", branch = "main" }
libc = "0.2"
# The 67 jq programs the fzf implementation spent describing the Actions API,
# replaced by one set of typed structs. See the header of src/model.rs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
